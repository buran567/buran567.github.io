name: Deploy to GitHub Pages

# 触发条件：main 分支有新提交，或者在 Actions 页面手动点按钮运行
on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 部署所需的权限，别改
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署任务，新的会取消旧的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Astro
        uses: withastro/action@v3
        with:
          node-version: 22
          package-manager: npm@latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
